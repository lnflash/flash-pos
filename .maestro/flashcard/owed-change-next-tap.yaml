# ENG-630 end to end. The read plans on a card with room; by the time the
# PIN is entered the card is full (FIXTURE_FULL: same P8, every other slot
# spent). The burn and the swap succeed, the first change LOAD answers
# 6A84, and the 5 sats of change are kept on the terminal. On the next
# charge (a fresh card state holding P4, FIXTURE_AFTER) the owed 4 + 1 go
# on first, then P4 pays the 4-sat bill exactly.
appId: com.flash.pos
name: 'eCash card: owed change is written on the next tap'
tags:
  - flashcard
---
- runFlow: common/login.yaml
- runFlow:
    file: common/charge.yaml
    env:
      D1: '3'
      D2: ''
- extendedWaitUntil:
    visible:
      id: 'pin-sheet'
    timeout: 30000
- runScript:
    file: scripts/post-fixture.js
    env:
      FIXTURE: ${FIXTURE_FULL}
- runFlow: common/enter-pin.yaml
# The money moved and the change could not land. The swap settled the bill,
# so the charge ends as paid (ENG-642): the change is saved on the terminal,
# and there is no PIN pad or "Tap card again" to run the charge a second time.
- extendedWaitUntil:
    visible:
      id: 'error-body'
      text: '3 sats are paid. Your 5 sats change is saved on this terminal and will be added once the card has a free slot.'
    timeout: 60000
# The headline says paid too: "The card is full" over a paid body reads as
# a failed charge, and the merchant charges the card again.
- assertVisible:
    id: 'error-title'
    text: 'Paid — change not on card'
- assertNotVisible: 'The card is full'
- assertNotVisible:
    id: 'pin-sheet'
- assertNotVisible: 'Tap card again'
- runScript:
    file: scripts/assert-state.js
    env:
      EXPECT: '{"unspent":[],"spentLabels":["P8"]}'
- runScript:
    file: scripts/post-fixture.js
    env:
      FIXTURE: ${FIXTURE_AFTER}
# Done is the one way out: back to a fresh keypad.
- tapOn:
    id: 'charge-done'
- extendedWaitUntil:
    visible: '.*Card balance'
    timeout: 15000
- runFlow:
    file: common/charge.yaml
    env:
      D1: '4'
      D2: ''
- runFlow: common/enter-pin.yaml
- extendedWaitUntil:
    visible: 'Charged 4 sats — paid by eCash card'
    timeout: 60000
- runScript:
    file: scripts/assert-state.js
    env:
      EXPECT: '{"unspent":[4,1],"spentLabels":["P4"]}'
- tapOn: 'Done'
- runFlow:
    file: common/balance.yaml
    env:
      SATS: '5'
- assertNotVisible:
    id: 'balance-owed'
