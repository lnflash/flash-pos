# The first change LOAD reaches the card but its answer is lost (deep link
# dropLoad=1: the bridge forwards the APDU, then reports the tag lost).
# The first piece of the change (ENG-701's split of the 5: 2 + 1 + 1 + 1) is
# ON the card and still "owed" on disk. The balance tap after the charge is
# the tap after a payment: the card's change grant lets the 3 sats still
# owed go on with no PIN. The 2 is reconciled from the card's openings (its
# opening is gone: it landed) and never loaded twice.
appId: com.flash.pos
name: 'eCash card: a lost LOAD answer is reconciled, never duplicated'
tags:
  - flashcard
---
- runFlow: common/login.yaml
- runFlow:
    file: common/charge.yaml
    env:
      D1: '3'
      D2: ''
- runFlow: common/enter-pin.yaml
# The change write died on a lost tag, after the swap: the bill is paid and
# the charge ends there (ENG-642), with no PIN pad or "Tap card again" that
# would run it a second time.
- extendedWaitUntil:
    visible:
      id: 'error-body'
      text: '3 sats are paid. Your 5 sats change is saved on this terminal and will be added the next time this card is charged.'
    timeout: 60000
- assertVisible:
    id: 'error-title'
    text: 'Paid — change not on card'
- assertNotVisible: 'The card moved away'
- assertNotVisible:
    id: 'pin-sheet'
- assertNotVisible: 'Tap card again'
- runScript:
    file: scripts/assert-state.js
    env:
      EXPECT: '{"unspent":[2],"spentLabels":["P8"]}'
# The stack's back gesture leaves the paid state as Done does: a reset to
# the keypad, never a pop onto a screen that could charge the bill again
# (owed-change-next-tap leaves by Done itself).
- runFlow: common/leave-charge.yaml
- runFlow:
    file: common/balance.yaml
    env:
      SATS: '5'
- assertVisible:
    id: 'balance-added'
    text: 'Change added · 3 sats'
- assertNotVisible:
    id: 'balance-owed'
# Every piece once: assert-state fails on any nonce in two slots.
- runScript:
    file: scripts/assert-state.js
    env:
      EXPECT: '{"unspent":[2,1,1,1],"spentLabels":["P8"]}'
