# Fresh install → card bridge on → merchant logged in on SAT → keypad.
# env: BRIDGE_LINK, FLASH_USERNAME (a TEST-instance merchant, never prod)
appId: com.flash.pos
---
- launchApp:
    clearState: true
    # The owed-change store lives in the keychain, keyed by card pubkey, and
    # cardsim's key is the same on every reset: start every flow clean.
    clearKeychain: true
# A prompt left up by an earlier flow survives the relaunch and hides the
# app: cancel it while waiting. 3 x 40 s is a ceiling for a slow boot.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          file: dismiss-open-prompt.yaml
          env:
            ANSWER: Cancel
      - extendedWaitUntil:
          visible: 'Enter your flash username'
          timeout: 40000
# After JS is up, so the Linking listener is there to hear it.
- openLink: ${BRIDGE_LINK}
# iOS asks before an app opens its own custom-scheme link, and the prompt
# slides in a moment later: let it settle, then answer it.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: dismiss-open-prompt.yaml
    env:
      ANSWER: Open
# Once more, now iOS remembers the choice and opens it with no prompt. On
# the hosted runner the first link, through the prompt, did not set the
# bridge: LogBox stayed on, and its toast over Start took the tap. Setting
# the bridge twice is harmless (same config, LOAD count from zero, nothing
# sent yet).
- openLink: ${BRIDGE_LINK}
- waitForAnimationToEnd:
    timeout: 3000
# A prompt that came late for the first link is answered here; the field
# is tapped only once nothing covers it.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          file: dismiss-open-prompt.yaml
          env:
            ANSWER: Open
      - tapOn:
          id: 'auth-username'
- inputText: ${FLASH_USERNAME}
- tapOn: 'flash POS'
# The picker button reads "JMD" plus its caret glyph.
- tapOn: 'JMD.*'
- tapOn:
    id: 'currency-SAT'
- runFlow:
    file: dismiss-open-prompt.yaml
    env:
      ANSWER: Open
- tapOn: 'Start'
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          file: dismiss-open-prompt.yaml
          env:
            ANSWER: Open
      - extendedWaitUntil:
          visible: '.*Card balance'
          timeout: 30000
