# A card with no PIN completes in the one tap: the finish runs straight
# after the read (CashuCardCharge.tsx), and the PIN sheet never opens.
appId: com.flash.pos
name: 'eCash card: charge without a PIN'
tags:
  - flashcard
---
- runFlow: common/login.yaml
- runFlow:
    file: common/charge.yaml
    env:
      D1: '3'
      D2: ''
- assertNotVisible:
    id: 'pin-sheet'
- extendedWaitUntil:
    visible: 'Charged 3 sats — paid by eCash card'
    timeout: 60000
- runScript:
    file: scripts/assert-state.js
    env:
      EXPECT: '{"unspent":[4,1],"spentLabels":["P8"]}'
