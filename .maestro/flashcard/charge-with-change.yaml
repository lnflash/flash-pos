# A PIN card pays a 3-sat bill from its 8-sat proof: read → PIN → burn →
# swap → change written back. The balance and the card both show 5.
# ENG-701: the 5 of change refills the card's covering ladder (2 + 1 + 1 + 1,
# splitChangeForLadder(5, [])), not the fewest pieces (4 + 1); the EXPECT
# below is checked against that function by __tests__/scripts/e2eLib.test.ts.
appId: com.flash.pos
name: 'eCash card: charge with change'
tags:
  - flashcard
---
- runFlow: common/login.yaml
- runFlow:
    file: common/charge.yaml
    env:
      D1: '3'
      D2: ''
- runFlow: common/enter-pin.yaml
- extendedWaitUntil:
    visible: 'Charged 3 sats — paid by eCash card'
    timeout: 60000
- runScript:
    file: scripts/assert-state.js
    env:
      EXPECT: '{"unspent":[2,1,1,1],"spentLabels":["P8"]}'
- tapOn: 'Done'
- runFlow:
    file: common/balance.yaml
    env:
      SATS: '5'
- assertNotVisible:
    id: 'balance-owed'
