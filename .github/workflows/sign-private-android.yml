name: Sign private Android store bundle
on: workflow_dispatch
concurrency: flash-pos-android-production
jobs:
  release:
    if: github.repository == 'lnflash/flash-pos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Read our unpublished draft release. GitHub limits draft access to push-capable identities.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Fetch the approved binary
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          gh api repos/lnflash/flash-pos/releases/460268936 --jq '.draft' | grep -x true
          gh api -H 'Accept: application/octet-stream' repos/lnflash/flash-pos/releases/assets/799394347 > unsigned.aab
          echo 'c7a6c854e38df4c0bdb8068066663b2a431f3800a09b8bc201173d8d6bc25fa1  unsigned.aab' | sha256sum -c -
      - name: Verify the registered POS certificate and sign
        working-directory: ${{ runner.temp }}
        env:
          STORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f upload.keystore' EXIT
          printf '%s' "$STORE_B64" | base64 -d > upload.keystore
          keytool -exportcert -keystore upload.keystore -alias "$KEY_ALIAS" -storepass:env STORE_PASS > upload.der
          echo '10835541597ac8c3c808c6f8b6abbe5ef9452bcc3f4f4d7a9b32bf9bf74fb8fa  upload.der' | sha256sum -c -
          jarsigner -keystore upload.keystore -storepass:env STORE_PASS -keypass:env KEY_PASS -signedjar signed.aab unsigned.aab "$KEY_ALIAS"
          jarsigner -verify signed.aab
      - name: Submit version 2.6.0 (38) to Google Play at 100 percent
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_JSON_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/play.json"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$PLAY_JSON" > "$key"
          notes="$RUNNER_TEMP/notes"
          mkdir -p "$notes/en-US/changelogs"
          echo 'Accept Fedimint Cards with a paired till. Customers can see the full debit, including fees, before confirming. Add a banner to your storefront and use the refreshed payment screens, settings and receipts.' > "$notes/en-US/changelogs/38.txt"
          bundle exec fastlane supply --package_name com.flash_pos --json_key "$key" --aab "$RUNNER_TEMP/signed.aab" --track production --release_status completed --version_code 38 --version_name '2.6.0' --metadata_path "$notes" --skip_upload_metadata --skip_upload_images --skip_upload_screenshots --rescue_changes_not_sent_for_review false
          bundle exec ruby - "$key" <<'RUBY'
          require 'google/apis/androidpublisher_v3'
          require 'googleauth'
          api = Google::Apis::AndroidpublisherV3::AndroidPublisherService.new
          File.open(ARGV.fetch(0)) do |file|
            api.authorization = Google::Auth::ServiceAccountCredentials.make_creds(
              json_key_io: file, scope: 'https://www.googleapis.com/auth/androidpublisher'
            )
          end
          package = 'com.flash_pos'
          edit = api.insert_edit(package)
          begin
            track = api.get_edit_track(package, edit.id, 'production')
            release = Array(track.releases).find { |r| Array(r.version_codes).map(&:to_s).include?('38') }
            abort 'Version 38 missing from production track readback' unless release
            abort "Unexpected rollout state #{release.status}" unless release.status == 'completed' && release.user_fraction.nil?
            puts "Play production readback: version 38, status completed, rollout 100%"
          ensure
            api.delete_edit(package, edit.id)
          end
          RUBY
