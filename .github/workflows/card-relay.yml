name: Card relay (2.2 outbox)

# ENG-821: an offline charge on the 2.2 applet, relayed by a phone process
# from the card's outbox (GET_OUTBOX) and recovered by the till's drain:
# __tests__/integration/cardRelayDemo.test.ts against cashucard/cashucard's
# cardsim and a throwaway Nutshell FakeWallet mint in Docker. The same one
# command runs it locally: scripts/card-relay/run-local.sh <cashucard checkout>.
# ENG-824: a matrix leg per mint keyset id shape, v2 (33-byte) and legacy 8-byte.
#
# Opt-in, not a required check: on demand, and on pull requests that touch the
# till's card or settlement services or the harness itself.

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/services/cashu*'
      - 'scripts/card-relay/**'
      - '__tests__/integration/cardRelayDemo.test.ts'
      - '__tests__/support/localFetch.ts'
      - '.github/workflows/card-relay.yml'
  workflow_dispatch:

concurrency:
  group: card-relay-${{ github.ref }}
  cancel-in-progress: true

env:
  # cashucard/cashucard main at ENG-822: CashuApplet 2.2 (GET_OUTBOX) and the
  # assisted-relay engine (tools/assisted-relay/relay.js) with unique-prefix
  # keyset resolution (cashucard#235) and its CI fix (#236).
  CASHU_CARD_REF: df3f0bf06338a38ba5d422aae37651bef6ce009f
  NUTSHELL_VERSION: '0.20.3'

jobs:
  relay:
    name: Phone relay, till recovery (cardsim 2.2, Nutshell, ${{ matrix.mint_ids }} ids)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mint_ids: [v2, legacy8]
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Cashu Card
        uses: actions/checkout@v4
        with:
          repository: cashucard/cashucard
          ref: ${{ env.CASHU_CARD_REF }}
          path: cashucard

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: cashucard/tools/cardsim/pom.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pull the mint image
        run: docker pull "cashubtc/nutshell:$NUTSHELL_VERSION"

      - name: Run the relay harness
        run: scripts/card-relay/run-local.sh "$GITHUB_WORKSPACE/cashucard" "${{ matrix.mint_ids }}"
