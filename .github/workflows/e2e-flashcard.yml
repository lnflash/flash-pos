name: E2E Flashcard (iOS simulator)

# The eCash card flows end to end on an iOS simulator (ENG-634): the real
# applet in jCardSim (cardsim, lnflash/cashu-javacard), a local Nutshell
# mint on FakeWallet, and the production charge/balance UI driven by
# Maestro through the Debug-only card bridge. Run book: docs/10-testing.md.
#
# Not a required check: it needs the TEST backend (login + price) and a
# simulator, so it runs on card-path changes, nightly and on demand.
# Needs the repository variable FLASH_POS_E2E_USERNAME: a merchant username
# on the TEST instance (api.test.flashapp.me), never a production account.

on:
  pull_request:
    branches: [main]
    paths:
      # Path filters are case-sensitive globs: list what the flows touch
      # explicitly rather than trusting a pattern (use*Card* misses
      # useFlashcard). A rename the flows depend on must run this workflow
      # on the PR, not surface as a nightly failure on main.
      - 'App.tsx'
      - 'src/services/cashu*'
      - 'src/services/cardBridge.ts'
      - 'src/services/blockHeader.ts'
      - 'src/services/phaseError.ts'
      - 'src/types/env.d.ts'
      - 'babel.config.js'
      - 'ios/flash_pos/Info.plist'
      - '__tests__/integration/**'
      - 'src/hooks/use*Card*'
      - 'src/hooks/useFlashcard*'
      - 'src/screens/CashuCard*'
      - 'src/screens/Auth.tsx'
      - 'src/screens/Keypad.tsx'
      - 'src/components/cashu/**'
      - 'src/components/keypad/**'
      - 'src/components/modals/CurrencyPicker.tsx'
      - 'src/utils/nfcTag.ts'
      - 'ios/flash_pos/AppDelegate.mm'
      - 'ios/flash_pos.xcodeproj/**'
      - 'package.json'
      - 'yarn.lock'
      - 'ios/scripts/register-dev-url-scheme.sh'
      - '.maestro/**'
      - 'scripts/e2e-flashcard.mjs'
      - 'scripts/e2e-flashcard/**'
      - '.env.example'
      - '.github/workflows/e2e-flashcard.yml'
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-flashcard-${{ github.ref }}
  cancel-in-progress: true

env:
  # lnflash/cashu-javacard main at #35 (ENG-681): the 2.0 applet, and a cardsim
  # that puts a package-AID SELECT on the opener, as the J3R180 does.
  CASHU_JAVACARD_REF: bced1c41726ef23e733cb228fd46f6fba568467d
  # The public release nearest forge's 0.20.3.1 (decision 6): its SIG_ALL
  # message is the unframed one the 2.0 card signs. A fresh 0.20.3 keyset
  # has a 33-byte (v2) id, which a card stores by its first 8 bytes and the
  # app expands back against the mint's keysets.
  NUTSHELL_VERSION: '0.20.3'
  MAESTRO_VERSION: '2.10.0'
  # A cold hosted simulator can take minutes to start Maestro's XCTest
  # driver; at the default, whole flows failed before their first step with
  # "iOS driver not ready in time" (run 38503213894, both attempts).
  MAESTRO_DRIVER_STARTUP_TIMEOUT: '180000'
  CARDSIM_URL: http://127.0.0.1:9876
  MINT_URL: http://127.0.0.1:3338

jobs:
  flashcard:
    name: eCash card flows (iOS simulator)
    runs-on: macos-15
    # The gate run took 38.5 min (about 22 of setup and build, 16 of
    # flows); leave room for a slow host or a cold cache. The flows step has
    # its own, shorter budget so that a hang there still leaves time to
    # collect and upload the output.
    timeout-minutes: 75
    # An explicit `shell: bash` runs as `bash --noprofile --norc -eo
    # pipefail {0}`; the implicit default is `bash -e {0}`, under which
    # `xcodebuild … | tail` and `curl … | head` exit 0 when the left side
    # fails.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---- the card: cardsim ------------------------------------------------
      - name: Checkout cashu-javacard (cardsim)
        uses: actions/checkout@v4
        with:
          repository: lnflash/cashu-javacard
          ref: ${{ env.CASHU_JAVACARD_REF }}
          path: cardsim

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: cardsim/tools/cardsim/pom.xml

      - name: Build and start cardsim
        run: |
          # Its own CI runs the cardsim suite at this ref; here it is a fixture.
          mvn -B -q -f cardsim/tools/cardsim/pom.xml package -DskipTests
          nohup java -jar cardsim/tools/cardsim/target/cardsim.jar --port 9876 \
            > "$RUNNER_TEMP/cardsim.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$CARDSIM_URL/state" > /dev/null && break
            sleep 1
          done
          # Not `curl | head -c`: under pipefail head's early exit would
          # fail curl with EPIPE on a healthy bridge.
          state=$(curl -sf "$CARDSIM_URL/state")
          echo "${state:0:200}"

      # ---- the mint: Nutshell on FakeWallet -------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/e2e-flashcard/nutshell-constraints.txt

      - name: Install and start the FakeWallet mint
        run: |
          python -m venv "$RUNNER_TEMP/nutshell"
          # Nutshell's own lockfile, but the breez-sdk-spark release it pins
          # (gone from PyPI): see the header of the constraints file.
          "$RUNNER_TEMP/nutshell/bin/pip" install -q \
            -r scripts/e2e-flashcard/nutshell-constraints.txt
          "$RUNNER_TEMP/nutshell/bin/pip" install -q breez-sdk-spark==0.17.0
          "$RUNNER_TEMP/nutshell/bin/pip" install -q --no-deps \
            "cashu==$NUTSHELL_VERSION"
          mkdir -p "$RUNNER_TEMP/mint"
          cd "$RUNNER_TEMP/mint"
          # Free and instant: FakeWallet pays every quote, no fees, no delays.
          cat > .env <<'ENV'
          DEBUG=FALSE
          TOR=FALSE
          MINT_LISTEN_HOST=127.0.0.1
          MINT_LISTEN_PORT=3338
          MINT_PRIVATE_KEY=ci-flashcard-e2e-throwaway-key
          MINT_DATABASE=data/mint
          MINT_BACKEND_BOLT11_SAT=FakeWallet
          MINT_INPUT_FEE_PPK=0
          # A throwaway local fixture: the integration suite and the flows
          # make more requests a minute than the default per-IP limit (60)
          # allows, and every one of them comes from 127.0.0.1.
          MINT_RATE_LIMIT=FALSE
          FAKEWALLET_BRR=TRUE
          FAKEWALLET_DELAY_INCOMING_PAYMENT=0
          FAKEWALLET_DELAY_OUTGOING_PAYMENT=0
          ENV
          nohup "$RUNNER_TEMP/nutshell/bin/mint" > "$RUNNER_TEMP/mint.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$MINT_URL/v1/info" > /dev/null && break
            sleep 1
          done
          curl -sf "$MINT_URL/v1/keysets"; echo

      # ---- the card layer against the real applet and mint (jest) ----------
      # The one test that proves a real SIG_ALL swap against the merged
      # applet: the production readAndPlan → executeCharge path on cardsim,
      # swapped at the Nutshell above. Before the iOS build, so a protocol
      # break fails in minutes rather than after the build.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Point the app at TEST and the local mint
        run: |
          cp .env.example .env
          # Rewrites the TEST hosts, the local mint and BTC_PAY_SERVER (to an
          # unroutable .invalid host), then fails if any flashapp.me host
          # but TEST is left on any key.
          scripts/e2e-flashcard/point-env-at-test.sh .env "$MINT_URL"

      - name: Run the card layer against cardsim and the mint
        run: |
          # The path before --selectProjects: that flag takes every word
          # after it as a project name.
          CARD_E2E_CARDSIM="$CARDSIM_URL" CARD_E2E_MINT="$MINT_URL" \
            yarn jest __tests__/integration/cardsimMint.test.ts \
            --selectProjects ios --ci --runInBand
          # The flows start from a clean card.
          curl -sf -X POST -H 'content-type: application/json' -d '{}' \
            "$CARDSIM_URL/reset" > /dev/null

      # ---- the app: a Debug build with its JS bundle embedded ----------------
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          cd ios
          bundle exec pod install

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Create a simulator
        run: |
          # The newest available iOS runtime (numeric version sort), then the
          # newest plain `iPhone N` that runtime itself supports. Picking the
          # runtime and the device type separately can pair a device the
          # runtime rejects (CoreSimulator 403 "Incompatible device").
          read -r RUNTIME DEVICE_TYPE < <(xcrun simctl list runtimes available -j | node -e '
            const num = (a, b) => a.localeCompare(b, undefined, { numeric: true });
            const r = JSON.parse(require("fs").readFileSync(0, "utf8")).runtimes
              .filter(x => x.platform === "iOS" && x.isAvailable)
              .sort((a, b) => num(a.version, b.version))
              .at(-1);
            const d = (r?.supportedDeviceTypes ?? [])
              .filter(t => /^iPhone \d+$/.test(t.name))
              .sort((a, b) => num(a.name, b.name))
              .at(-1);
            console.log(r?.identifier ?? "", d?.identifier ?? "");') || true
          echo "runtime: ${RUNTIME:-<none>}"
          echo "device type: ${DEVICE_TYPE:-<none>}"
          if [ -z "$RUNTIME" ] || [ -z "$DEVICE_TYPE" ]; then
            echo "::error::No available iOS runtime with a supported plain iPhone device type."
            xcrun simctl list runtimes available
            exit 1
          fi
          SIM=$(xcrun simctl create flashcard-e2e "$DEVICE_TYPE" "$RUNTIME")
          echo "SIM_ID=$SIM" >> "$GITHUB_ENV"
          echo "simulator $SIM ($DEVICE_TYPE, $RUNTIME)"

      - name: Build iOS app (Debug, bundle embedded)
        run: |
          # FORCE_BUNDLING embeds main.jsbundle (still __DEV__) so the app
          # runs with no Metro; AppDelegate falls back to it. Ad-hoc signed,
          # not unsigned: without its entitlements the simulator keychain
          # refuses react-native-keychain, the owed-change store reads as
          # unreadable and every charge fails closed.
          xcodebuild -workspace ios/flash_pos.xcworkspace \
            -scheme flash_pos \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_ID" \
            -derivedDataPath ios/build \
            build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= \
            FORCE_BUNDLING=1 | tail -n 40
          APP="ios/build/Build/Products/Debug-iphonesimulator/Flash POS.app"
          test -f "$APP/main.jsbundle"
          # The Debug-only dev scheme the card-bridge link needs.
          plutil -p "$APP/Info.plist" | grep -q '"flashpos"'
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Boot the simulator and install the app
        run: |
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          # A fresh simulator shows the keyboard's one-time introductions
          # (slide to type) over the app the first time a field is focused.
          for key in DidShowContinuousPathIntroduction \
            DidShowGestureKeyboardIntroduction \
            KeyboardDidShowProductivityTutorial; do
            xcrun simctl spawn "$SIM_ID" defaults write com.apple.Preferences "$key" -bool true
          done
          xcrun simctl install "$SIM_ID" "$APP_PATH"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Checked here, not first: only the login needs the merchant, so a
      # missing variable still lets every step above (cardsim, the mint, the
      # app build, the simulator, Maestro) run and show it works.
      - name: Check the TEST merchant is configured
        env:
          FLASH_POS_E2E_USERNAME: ${{ vars.FLASH_POS_E2E_USERNAME }}
        run: |
          if [ -z "$FLASH_POS_E2E_USERNAME" ]; then
            echo "::error::Set the repository variable FLASH_POS_E2E_USERNAME to a TEST-instance merchant username."
            exit 1
          fi

      - name: Run the eCash card flows
        timeout-minutes: 40
        env:
          FLASH_POS_E2E_USERNAME: ${{ vars.FLASH_POS_E2E_USERNAME }}
        run: |
          node scripts/e2e-flashcard.mjs \
            --username "$FLASH_POS_E2E_USERNAME" \
            --cardsim-client cardsim/tools/cardsim/client.cjs \
            --bridge "$CARDSIM_URL" \
            --mint "$MINT_URL" \
            --device "$SIM_ID"

      # Maestro names its output folders after the flow titles, and
      # upload-artifact refuses a path holding any of " : < > | * ? CR LF:
      # copy the tree to names it accepts. Never fails the job itself.
      - name: Collect Maestro output
        if: always()
        run: |
          out="$RUNNER_TEMP/e2e-output"
          mkdir -p "$out"
          if [ -d "$HOME/.maestro/tests" ]; then
            node -e '
              const fs = require("fs");
              const path = require("path");
              const safe = n => n.replace(/[":<>|*?\r\n]/g, "_");
              const copy = (src, dst) => {
                for (const e of fs.readdirSync(src, { withFileTypes: true })) {
                  const s = path.join(src, e.name);
                  const d = path.join(dst, safe(e.name));
                  if (e.isDirectory()) {
                    fs.mkdirSync(d, { recursive: true });
                    copy(s, d);
                  } else if (e.isFile()) {
                    fs.copyFileSync(s, d);
                  }
                }
              };
              fs.mkdirSync(process.argv[2], { recursive: true });
              copy(process.argv[1], process.argv[2]);
            ' "$HOME/.maestro/tests" "$out/maestro" || echo "::warning::could not copy the Maestro output"
          fi
          if [ -n "${SIM_ID:-}" ]; then
            xcrun simctl io "$SIM_ID" screenshot "$out/simulator-final.png" || true
          fi
          cp "$RUNNER_TEMP/cardsim.log" "$RUNNER_TEMP/mint.log" "$out/" 2>/dev/null || true

      - name: Upload Maestro output and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-flashcard
          path: ${{ runner.temp }}/e2e-output
          retention-days: 7
          if-no-files-found: warn
